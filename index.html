<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Construction</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Helper Classes */
    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
    }
    .font-inter {
      font-family: 'Inter', sans-serif;
    }

    /* Hero Section */
    .construction-hero-section {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: #0b0e14;
      overflow: hidden;
      padding: 120px 0 100px 0;
    }

    .construction-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .construction-hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      display: block;
    }

    .construction-hero-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      padding: 0 60px;
      display: flex;
      align-items: center;
    }

    .construction-hero-content {
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .construction-hero-sub {
      color: #FF6249;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      display: block;
      text-transform: uppercase;
    }

    .construction-hero-title.font-bebas {
      font-size: 88px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin: 0 0 28px 0;
      text-transform: uppercase;
    }

    .construction-hero-title .text-orange {
      color: #FF6249;
      display: block;
    }

    .construction-hero-lead {
      font-size: 16px;
      line-height: 1.6;
      color: #8a99ad;
      margin: 0 0 40px 0;
      max-width: 520px;
    }

    .btn-primary-orange {
      background: #FF6249;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: none;
    }

    .btn-primary-orange:hover {
      background: #ff7761;
      transform: translateY(-2px);
    }

    .btn-primary-orange .btn-arrow {
      font-size: 18px;
      line-height: 1;
    }

    /* Responsive adjustments */
    @media (max-width: 1280px) {
      .construction-hero-title.font-bebas {
        font-size: 72px;
      }
    }

    @media (max-width: 992px) {
      .construction-hero-container {
        padding: 0 30px;
      }
      .construction-hero-title.font-bebas {
        font-size: 56px;
      }
      .construction-hero-bg img {
        object-position: 70% center;
      }
    }

    @media (max-width: 560px) {
      .construction-hero-title.font-bebas {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>

  <section class="construction-hero-section">
    
    <!-- Background Image -->
    <div class="construction-hero-bg">
      <img src="img/prowem_hero.jpg" alt="Prowem Background">
    </div>

    <!-- Content Area Left -->
    <div class="construction-hero-container">
      <div class="construction-hero-content">
        <span class="construction-hero-sub font-inter">ALMOST THERE</span>
        
        <h1 class="construction-hero-title font-bebas">
          LAUNCHING TODAY<br>
          <span class="text-orange">AT 8:00 PM</span>
        </h1>
        
        <p class="construction-hero-lead font-inter">
          We are putting the final touches on something big. Our new platform goes live tonight at 8:00 PM with brand new features and complete matchday control.
        </p>

        <a href="mailto:info@prowem.com" class="btn-primary-orange font-inter">
          Get In Touch <span class="btn-arrow">&rarr;</span>
        </a>
      </div>
    </div>

  </section>

</body>
</html>
